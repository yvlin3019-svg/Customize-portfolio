<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>カスタマイズ実績</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDF0; --surface:#FFFFFF; --ink:#1C2733; --muted:#5E6B78; --line:#CDD5DC; --soft:#F2F5F7; --track:#D3DBE2;
  --sale:#C23A2B; --sale-soft:#F8E4E1; --full:#1D5F5B; --full-soft:#DDEDEB; --tape:#FBFBF7;
  --ok:#2E7D4F; --ok-soft:#DFF0E5; --target:#8A96A3;
  --focus:#2F6FD6;
  --num:"Barlow Semi Condensed","Noto Sans JP",system-ui,sans-serif;
  --text:"Noto Sans JP","Hiragino Sans","Yu Gothic","Meiryo",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#151B21; --surface:#1F2830; --ink:#E6ECF1; --muted:#9AA7B3; --line:#34414C; --soft:#27313A; --track:#3A4854;
    --sale:#EE7A6B; --sale-soft:#3A2522; --full:#6CC3BA; --full-soft:#1D3533; --tape:#252F38;
    --ok:#6FCB94; --ok-soft:#1E3528; --target:#7C8894;
    --focus:#7FA9F0;
  }
}
:root[data-theme="dark"]{
  --bg:#151B21; --surface:#1F2830; --ink:#E6ECF1; --muted:#9AA7B3; --line:#34414C; --soft:#27313A; --track:#3A4854;
  --sale:#EE7A6B; --sale-soft:#3A2522; --full:#6CC3BA; --full-soft:#1D3533; --tape:#252F38;
  --ok:#6FCB94; --ok-soft:#1E3528; --target:#7C8894;
  --focus:#7FA9F0;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.55}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 56px}
input,select,button{font:inherit;color:inherit}
input[type=date],input[type=text].plain,input[type=number].plain,select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}

/* header */
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-bottom:12px}
h1{font-size:1.35rem;margin:0;font-weight:700;letter-spacing:.02em}
.pchip{font-size:.85rem;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pchip b{font-family:var(--num);font-size:1.05rem;color:var(--ink)}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:2px solid var(--line);margin-bottom:12px}
.tabs button{min-width:0;border:0;background:transparent;padding:9px 2px;font-weight:700;font-size:.92rem;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;text-align:center;overflow-wrap:anywhere}
@media (max-width:380px){.tabs button{font-size:.82rem}}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink)}
.banner{background:var(--sale-soft);color:var(--sale);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:.92rem}
.banner.info{background:var(--soft);color:var(--muted)}
.bar-controls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:14px}
label.inline{display:flex;align-items:center;gap:6px;font-size:.9rem;color:var(--muted)}
label.inline select,label.inline input{color:var(--ink)}
.staffsel{font-weight:700;min-width:9em}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:820px){
  .layout{grid-template-columns:1fr;gap:14px}
  .layout > main{display:contents}
  .layout .panel + .panel{margin-top:0}
  .tape{order:2}
  .daylistpanel{order:3}
}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel + .panel{margin-top:16px}
.panel h2{font-size:1.05rem;margin:0 0 12px}
.panel h2 small{font-weight:400;color:var(--muted);font-size:.8rem;margin-left:6px}

/* receipt tape */
.tape{background:var(--tape);border:1px solid var(--line);padding:20px 20px 26px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);
  -webkit-mask:radial-gradient(circle 7px at 50% 100%,transparent 6.5px,#000 7px) 0 0/18px 100% repeat-x;
          mask:radial-gradient(circle 7px at 50% 100%,transparent 6.5px,#000 7px) 0 0/18px 100% repeat-x}
@media (max-width:820px){.tape{position:static}}
.tape h2{font-size:1rem;margin:0 0 2px}
.tape .date{color:var(--muted);font-size:.85rem;margin-bottom:10px}
.scope{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:12px}
.scope button{border:0;background:transparent;padding:6px;font-size:.85rem;cursor:pointer;color:var(--muted)}
.scope button[aria-pressed=true]{background:var(--ink);color:var(--surface);font-weight:700}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:baseline;padding:10px 0;border-top:1px dashed var(--line)}
.row .lbl{font-size:.95rem}
.row .val{font-family:var(--num);font-weight:700;font-size:1.6rem;line-height:1;font-variant-numeric:tabular-nums;text-align:right}
.row .val small{font-size:.9rem;font-weight:600;margin-left:2px;color:var(--muted)}
.row .sub{grid-column:1 / 3;font-size:.82rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.row .sub b{font-family:var(--num);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.group{margin-top:12px}
.group h3{font-size:.9rem;margin:0 0 2px;padding-left:8px;border-left:4px solid var(--ink)}
.group.full h3{border-color:var(--full);color:var(--full)}
.group.full .val{color:var(--full)}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:4px}
.summary p{margin:0 0 10px;font-size:.98rem;line-height:1.7;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.summary .btn{width:100%;font-weight:700}
.daygoal{margin:12px 0 4px;font-size:.85rem;color:var(--muted)}
.daygoal .nums{display:flex;justify-content:space-between;align-items:baseline}
.daygoal b{font-family:var(--num);font-size:1.2rem;color:var(--ink)}

/* form */
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.types button{border:2px solid var(--line);background:transparent;border-radius:10px;padding:12px;font-weight:700;font-size:1.05rem;cursor:pointer}
.types button[aria-pressed=true].sale{border-color:var(--sale);background:var(--sale-soft);color:var(--sale)}
.types button[aria-pressed=true].full{border-color:var(--full);background:var(--full-soft);color:var(--full)}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin:-2px 0 14px}
.cats .lbl{font-size:.85rem;color:var(--muted);width:100%}
.cats button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 8px;cursor:pointer;font-weight:500}
.cats button[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:700}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.15)}
.fields{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:12px}
@media (max-width:520px){.fields{grid-template-columns:1fr 1fr}.fields .price{grid-column:1 / 3}}
.field label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.stepper{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.stepper button{width:42px;border:0;background:var(--bg);font-size:1.2rem;cursor:pointer}
.stepper input{width:100%;min-width:0;border:0;text-align:center;font-family:var(--num);font-size:1.3rem;font-weight:600;padding:8px 0;background:transparent}
.price-in{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--surface)}
.price-in span{color:var(--muted)}
.price-in input{width:100%;min-width:0;border:0;background:transparent;font-family:var(--num);font-size:1.3rem;font-weight:600;padding:8px 6px;text-align:right}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.extra{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end;margin-top:12px}
.extra .field{width:170px}
.check{display:flex;align-items:center;gap:8px;font-size:.92rem;cursor:pointer;padding:8px 0}
.check input{width:18px;height:18px}
.hint{font-size:.82rem;color:var(--muted);margin:10px 0 0}
.err{color:var(--sale);font-size:.88rem;min-height:1.3em;margin:8px 0 0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:700;padding:12px 18px;width:100%;margin-top:4px;font-size:1.05rem}
.btn.danger{color:var(--sale)}
.btn.small{padding:4px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* tables */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:.78rem;color:var(--muted);font-weight:500}
td.num{font-family:var(--num);font-weight:600;font-size:1.02rem;font-variant-numeric:tabular-nums}
.tl{text-align:left}
.tag{display:inline-block;white-space:nowrap;font-size:.76rem;font-weight:700;padding:1px 8px;border-radius:4px}
.tag.delete{background:var(--sale-soft);color:var(--sale)}
.tag.multi{background:var(--full-soft);color:var(--full)}
.tag.own{background:var(--soft);color:var(--muted);font-weight:500}
.catlbl{display:inline-flex;align-items:center;gap:5px;font-size:.85rem}
.catlbl .dot{width:10px;height:10px}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.listhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.listhead h2{margin:0}
@media (max-width:600px){
  .daylist table{min-width:0}
  .daylist thead{display:none}
  .daylist tbody tr{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 8px;padding:10px 0;border-bottom:1px solid var(--line)}
  .daylist tbody td{border:0;padding:0;text-align:left;white-space:normal}
  .daylist tbody td.who{grid-column:1 / 3;font-weight:700}
  .daylist tbody td.kind{grid-column:3 / 4}
  .daylist tbody td.del{grid-column:4;text-align:right}
  .daylist tbody td[data-label]::before{content:attr(data-label);display:block;font-family:var(--text);font-size:.72rem;font-weight:400;color:var(--muted)}
  .daylist tbody td.empty{grid-column:1 / -1;text-align:center}
}

/* period view */
.kpis{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:12px;margin-bottom:16px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kpis .big{grid-column:1 / -1}}
@media (max-width:760px){#view-period .kpi:not(.big){padding:8px}#view-period .kpi:not(.big) .v{font-size:1.25rem}#view-period .kpi:not(.big) .k,#view-period .kpi:not(.big) .s{font-size:.7rem}#view-period .kpi:not(.big) .v small{font-size:.72rem}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .k{font-size:.82rem;color:var(--muted)}
.kpi .v{font-family:var(--num);font-weight:700;font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:1rem;color:var(--muted);font-weight:600;margin-left:3px}
.kpi .s{font-size:.8rem;color:var(--muted);margin-top:2px}
.kpi .s span{display:block;white-space:nowrap}
.kpi .k,.kpi .v{white-space:nowrap}
.corner .c1 span,.corner .c2 span,.legend span,.dsum span,.pinfo,.ptgt{white-space:nowrap}
.kpi{min-width:0;overflow:hidden}
.kpi.big .v{font-size:2.6rem}
.progress{position:relative;height:14px;background:var(--track);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);border-radius:7px;margin-top:10px;overflow:visible}
.progress .fill{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:7px;max-width:100%}
.progress .fill.done{background:var(--ok)}
.progress .pace{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--sale)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.two .panel + .panel{margin-top:0}
.chart svg{width:100%;height:auto;display:block}
.bars{display:grid;gap:10px}
.bars .b{display:grid;grid-template-columns:6.5em 1fr 3.2em;gap:8px;align-items:center;font-size:.88rem}
.bars .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .track{display:flex;height:16px;background:var(--track);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);border-radius:4px;overflow:hidden}
.bars .track span{display:block;height:100%}
.bars .n{font-family:var(--num);font-weight:700;text-align:right;font-size:1.05rem}
.matrix table{min-width:560px}
.matrix th,.matrix td{padding:6px 7px;text-align:center}
.matrix th.tl,.matrix td.tl{text-align:left}
.matrix thead th{border-bottom:1px solid var(--line)}
.matrix thead tr:first-child th{color:var(--ink);font-weight:700;font-size:.8rem}
.matrix .wk{border-left:2px solid var(--line)}
.matrix td.z{color:var(--line)}
.matrix tr.total td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
.matrix td.m{color:var(--full)} .matrix td.dl{color:var(--sale)}
.exports{display:flex;flex-wrap:wrap;gap:8px}

/* settings */
.srow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow input[type=text]{flex:1 1 8em;min-width:0}
.srow .btn{flex:none}
.srow.hidden-staff input[type=text]{color:var(--muted);text-decoration:line-through}
.ptable input{width:100%}
.ptable td{padding:6px 4px}
.ptable input[type=date]{min-width:9.5em}
.ptable input.tgt{width:6em;text-align:right}
.addrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.addrow input{flex:1 1 8em;min-width:0}
.addrow .btn{flex:none}
.catset{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.catset input[type=text]{flex:1 1 auto;min-width:0}
.catset .btn{flex:none}
input[type=color]{flex:none!important;width:40px;height:34px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--surface);cursor:pointer}
.note{font-size:.84rem;color:var(--muted);margin:6px 0 0}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 16px;border-radius:8px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10;max-width:92vw}
.toast.show{opacity:1}
.toast.action{pointer-events:auto;display:flex;white-space:nowrap;align-items:center;gap:14px}
.toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:6px;padding:3px 10px;font-weight:700;cursor:pointer}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

/* corner progress */
.corner{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:230px;font-size:.82rem;color:var(--muted)}
.corner .c1{display:flex;justify-content:space-between;gap:10px}
.corner .c1 b{color:var(--ink);font-size:.95rem}
.corner .c2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:2px}
.corner .c2 b{font-family:var(--num);font-size:1.15rem;color:var(--ink)}
.corner .pct{font-family:var(--num);font-weight:700;font-size:1.35rem;color:var(--ink)}
.corner .progress{height:8px;margin-top:6px}
@media (max-width:560px){.corner{width:100%}}

/* calendar */
.calnav{display:flex;align-items:center;gap:6px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.calgrid .h{text-align:center;font-size:.8rem;color:var(--muted)}
.calgrid .h.sun{color:var(--sale)}
.calgrid .blank{min-height:64px;border-radius:8px;background:transparent}
.calgrid button.day{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:64px;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.calgrid button.day .d{font-size:.78rem;color:var(--muted)}
.calgrid button.day .c{font-family:var(--num);font-weight:700;font-size:1.35rem;line-height:1}
.calgrid button.day .c small{font-size:.75rem;color:var(--muted);font-weight:600;margin-left:1px}
.calgrid button.day.zero .c{color:var(--line)}
.calgrid button.day.today{box-shadow:inset 0 0 0 2px var(--ink)}
.calgrid button.day[aria-pressed=true]{background:var(--ink);border-color:var(--ink)}
.calgrid button.day[aria-pressed=true] .d,.calgrid button.day[aria-pressed=true] .c,.calgrid button.day[aria-pressed=true] .c small{color:var(--surface)}
.calgrid button.day .flag{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--sale)}
.calgrid button.day.out{opacity:.4}
.callegend{font-size:.8rem;color:var(--muted);margin-top:10px;display:flex;gap:14px;flex-wrap:wrap}
.callegend .flag{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sale);margin-right:4px;vertical-align:middle}

/* day detail */
.dsum{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.88rem;color:var(--muted);margin-bottom:12px}
.dsum b{font-family:var(--num);font-size:1.15rem;color:var(--ink)}
.bulk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--sale-soft);color:var(--sale);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:.88rem}
.ecard{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.ecard.unset{border-left:4px solid var(--sale)}
.etop{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:10px}
.etop .no{font-family:var(--num);font-weight:700;color:var(--muted)}
.etop .nums{font-family:var(--num);font-weight:600;font-size:1.05rem;margin-left:auto}
.seg{display:inline-grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 12px;font-size:.85rem;cursor:pointer;color:var(--muted);font-weight:700}
.seg button[aria-pressed=true].delete{background:var(--sale-soft);color:var(--sale)}
.seg button[aria-pressed=true].multi{background:var(--full-soft);color:var(--full)}
.erow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-bottom:8px}
.erow select{font-weight:700;min-width:8em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 6px;cursor:pointer;font-size:.85rem}
.chips button[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:700}
.chips .lbl{font-size:.8rem;color:var(--muted);align-self:center;margin-right:2px}
details.fix{margin-top:10px;font-size:.85rem}
details.fix summary{cursor:pointer;color:var(--muted)}
.fixgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.fixgrid label{font-size:.78rem;color:var(--muted)}
.fixgrid input{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface);font-family:var(--num);font-size:1.05rem;text-align:right}
.eactions{display:flex;justify-content:flex-end;margin-top:8px}
.mono-panel{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.mono-panel h2{margin:0}
.mono-panel p{margin:2px 0 0;font-size:.82rem;color:var(--muted)}
.mono-panel .stepper{width:180px}

/* dot tables */
.dots{display:inline-flex;flex-wrap:wrap;gap:3px;vertical-align:middle}
.dots i{display:block;width:11px;height:11px;border-radius:50%;flex:none}
.dots i.hollow{background:transparent;border:1.5px solid var(--muted)}
.dotcell .dots{max-width:84px;justify-content:center}
.matrix table.dotted{min-width:0}
.matrix .dotted th.wk{min-width:96px}
.matrix .dotted td.dotcell{border-left:2px solid var(--line);vertical-align:middle;padding:8px 6px}
.zdot{color:var(--line)}
.many{font-family:var(--num);font-weight:700}
.matrix .dotted .total .m{color:var(--full)} .matrix .dotted .total .dl{color:var(--sale)}
/* compact 日次入力 */
#view-input .bar-controls{margin-bottom:10px}
#view-input .layout{gap:12px}
#view-input .panel{padding:12px 14px}
#view-input .panel + .panel{margin-top:10px}
#view-input .panel h2{font-size:.95rem;margin:0 0 8px}
#view-input .types{gap:8px;margin-bottom:10px}
#view-input .types button{padding:7px;font-size:.95rem;border-width:1.5px}
#view-input .fields{gap:8px}
#view-input .field label{font-size:.76rem;margin-bottom:2px}
#view-input .stepper button{width:34px;font-size:1.05rem}
#view-input .stepper input{font-size:1.1rem;padding:5px 0}
#view-input .price-in input{font-size:1.1rem;padding:5px 4px}
#view-input .err{min-height:0;margin:6px 0 0}
#view-input .err:empty{display:none}
#view-input .btn.primary{padding:9px 14px;font-size:1rem;margin-top:8px}
#view-input .mono-panel{flex-wrap:nowrap}
#view-input .mono-panel h2{margin:0;font-size:.9rem}
#view-input .mono-panel .stepper{width:140px}
#view-input .tape{padding:14px 14px 20px}
#view-input .tape .date{margin-bottom:8px}
#view-input .summary{padding:10px}
#view-input .summary p{margin-bottom:8px}
#view-input .summary .btn{padding:7px}
#view-input .row{padding:7px 0}
#view-input .row .val{font-size:1.3rem}
#view-input .group{margin-top:8px}
details.breakdown{margin-top:8px}
details.breakdown > summary{cursor:pointer;font-size:.85rem;color:var(--muted);padding:4px 0}
#view-input th,#view-input td{padding:6px 6px}
@media (max-width:420px){
  #view-input .fields{grid-template-columns:1fr 1fr 1.2fr}
  #view-input .fields .price{grid-column:auto}
  #view-input .stepper button{width:28px}
}
/* compact 月度集計 */
#view-period .bar-controls{margin-bottom:10px}
#view-period .panel{padding:12px 14px}
#view-period .panel + .panel{margin-top:10px}
#view-period .panel h2{font-size:.95rem;margin:0 0 8px}
#view-period .kpis{gap:8px;margin-bottom:10px}
#view-period .kpi{padding:10px 12px}
#view-period .kpi .k{font-size:.76rem}
#view-period .kpi .v{font-size:1.5rem}
#view-period .kpi.big .v{font-size:1.9rem}
#view-period .kpi .s{font-size:.74rem}
#view-period .progress{height:10px;margin-top:6px}
#view-period .legend{font-size:.74rem;margin-top:6px}
#view-period .two{gap:10px}
#view-period .two + .panel{margin-top:10px!important}
#view-period .chart svg{max-height:200px}
#view-period .bars{gap:6px}
#view-period .bars .b{font-size:.82rem}
#view-period .bars .track{height:12px}
#view-period .banner{padding:8px 12px;font-size:.85rem;margin-bottom:10px}
#view-period th,#view-period td{padding:5px 6px;font-size:.85rem}
#view-period td.num{font-size:.95rem}
#view-period .matrix .dotted th.wk{min-width:80px}
#view-period .dots i{width:9px;height:9px}
#view-period .dotcell .dots{max-width:72px}
/* compact 設定 */
#view-settings .panel{padding:12px 14px}
#view-settings .panel + .panel{margin-top:10px}
#view-settings .panel h2{font-size:.95rem;margin:0 0 8px}
#view-settings input[type=text],#view-settings input[type=number],#view-settings input[type=date],#view-settings select{padding:4px 8px;font-size:.9rem;min-height:32px;border-radius:6px}
#view-settings input[type=color]{width:32px;height:32px;padding:1px}
#view-settings .srow,#view-settings .catset{padding:3px 0;border:0;gap:6px;display:flex;align-items:center}
#view-settings .srow input[type=text],#view-settings .catset input[type=text]{flex:1 1 auto;min-width:0}
#view-settings .addrow{margin-top:8px;gap:6px;align-items:center;flex-wrap:nowrap}
#view-settings .addrow input[type=text]{flex:1 1 auto;min-width:0;width:auto}
#view-settings .addrow .note{min-width:0;flex:1 1 auto}
#view-settings .srow,#view-settings .catset{flex-wrap:nowrap}
#view-settings .addrow .note{margin:0}
.ibtn{flex:none;min-width:30px;height:30px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;font-size:.9rem;line-height:1;padding:0 6px;color:var(--muted)}
.ibtn.danger{color:var(--sale)}
.ibtn.armed{background:var(--sale);color:#fff;border-color:var(--sale);font-size:.75rem}
.ibtn:disabled{opacity:.35;cursor:default}
#view-settings .pcard{padding:8px 10px;margin-bottom:8px;border-radius:8px}
.pline{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pline + .pline{margin-top:6px}
.pline .pname{flex:1 1 7em;min-width:0;font-weight:700}
.ptgt{display:flex;align-items:center;gap:4px;font-size:.82rem;color:var(--muted);white-space:nowrap}
.ptgt input{width:4.5em;text-align:right}
.pline.dates input[type=date]{flex:1 1 8.5em;min-width:0;max-width:11em;-webkit-appearance:none;appearance:none}
.pline.dates span{color:var(--muted);font-size:.85rem}
.pinfo{font-size:.78rem!important;margin-left:auto}
#view-settings .wlist{margin-top:6px;font-size:.76rem;gap:2px 10px}
.taxrow{display:flex;align-items:center;gap:12px}
.taxrow h2{margin:0!important}
/* compact 当日の明細（日次入力） */
#view-input .daylist table{font-size:.88rem}
#view-input .daylist td.num{font-size:.95rem}
#view-input .daylist .tag{font-size:.7rem;padding:0 6px}
@media (max-width:600px){
  #view-input .daylist tbody tr{display:grid;grid-template-columns:1.4em auto auto auto minmax(max-content,1fr) auto;grid-template-rows:auto auto;align-items:center;column-gap:10px;row-gap:0;padding:6px 0}
  #view-input .daylist tbody td{grid-row:1 / 3;white-space:nowrap}
  #view-input .daylist tbody td.who{grid-column:1;color:var(--muted);font-weight:600}
  #view-input .daylist tbody td.kind{grid-column:2;white-space:nowrap}
  #view-input .daylist tbody td[data-label="件"]{grid-column:3}
  #view-input .daylist tbody td[data-label="パーツ"]{grid-column:4}
  #view-input .daylist tbody td[data-label="税抜"]{grid-column:5;grid-row:1;text-align:right;white-space:nowrap}
  #view-input .daylist tbody td[data-label="税込"]{grid-column:5;grid-row:2;text-align:right;white-space:nowrap;font-size:.85rem;color:var(--muted)}
  #view-input .daylist tbody td.del{grid-column:6}
  #view-input .daylist tbody td[data-label]::before{display:inline;font-size:.66rem;margin-right:3px}
  #view-input .daylist tbody td[data-label="件"]::before{content:none}
  #view-input .daylist tbody td[data-label="件"]::after{content:"件";font-size:.72rem;color:var(--muted);font-family:var(--text);margin-left:1px}
  #view-input .daylist tbody td[data-label="パーツ"]::before{content:"P"}
  #view-input .daylist tbody td.empty{grid-column:1 / -1}
}
/* compact カレンダー明細 */
#dayPanel{padding:12px 14px}
#dayPanel h2{font-size:.95rem}
#dayPanel .dsum{font-size:.8rem;gap:4px 12px;margin-bottom:8px}
#dayPanel .dsum b{font-size:1rem}
#dayPanel .bulk{padding:6px 10px;font-size:.8rem;margin-bottom:8px}
#dayPanel .bulk select{padding:3px 6px;font-size:.85rem}
#dayPanel .ecard{padding:8px 10px;margin-bottom:6px;border-radius:8px}
#dayPanel .etop{gap:6px 10px;margin-bottom:6px}
#dayPanel .etop .nums{font-size:.9rem}
#dayPanel .seg button{padding:3px 10px;font-size:.78rem}
#dayPanel .erow{gap:6px 12px;margin-bottom:6px}
#dayPanel .erow label.inline{font-size:.8rem}
#dayPanel .erow select{padding:3px 6px;font-size:.85rem;min-width:6.5em}
#dayPanel .check{padding:0;font-size:.8rem}
#dayPanel .check input{width:16px;height:16px}
#dayPanel .chips{gap:4px}
#dayPanel .chips .lbl{font-size:.74rem}
#dayPanel .chips button{padding:2px 9px 2px 5px;font-size:.78rem}
#dayPanel .chips .dot{width:11px;height:11px}
#dayPanel details.fix{margin-top:6px;font-size:.76rem}
#dayPanel .fixgrid input{padding:4px 6px;font-size:.9rem}
#dayPanel .note{font-size:.76rem}
/* compact カレンダー */
#view-cal .bar-controls{margin-bottom:8px;gap:6px 10px}
#view-cal .bar-controls .note{margin:0;font-size:.78rem}
#view-cal .calnav select{padding:4px 6px;font-size:.88rem}
#view-cal .calnav .btn.small{padding:3px 10px}
#view-cal > .panel:first-of-type{padding:10px}
#view-cal .calgrid{gap:3px}
#view-cal .calgrid .h{font-size:.72rem}
#view-cal .calgrid .blank{min-height:0}
#view-cal .calgrid button.day{min-height:0;height:clamp(42px,7.2vh,58px);padding:2px 1px;border-radius:6px;gap:0}
#view-cal .calgrid button.day .d{font-size:.68rem;line-height:1.1}
#view-cal .calgrid button.day .c{font-size:1.05rem}
#view-cal .calgrid button.day .c small{font-size:.6rem}
#view-cal .calgrid button.day .flag{top:3px;right:3px;width:6px;height:6px}
#view-cal .callegend{font-size:.72rem;margin-top:6px;gap:4px 10px}
.handle{flex:none;width:28px;height:30px;border:0;background:transparent;color:var(--muted);font-size:1.15rem;line-height:1;cursor:grab;touch-action:none;border-radius:6px;padding:0}
.handle:active{cursor:grabbing}
.handle:disabled{opacity:.3;cursor:default}
.srow.shifting,.catset.shifting{transition:transform .15s ease}
.srow.dragging,.catset.dragging{position:relative;z-index:5;background:var(--surface);box-shadow:0 4px 14px rgba(0,0,0,.18);border-radius:8px}
@media (prefers-reduced-motion:reduce){.srow.shifting,.catset.shifting{transition:none}}
.chipbox{display:flex;flex-wrap:wrap;gap:6px}
.schip{position:relative;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.88rem;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--ink);font-weight:500}
.schip.sel{border-color:var(--sale);background:var(--sale-soft);padding:3px 3px 3px 12px;cursor:pointer}
.schip.sel .nm{color:var(--sale);font-weight:700}
.schip .dot{width:12px;height:12px}
.chipcolor{width:26px!important;height:26px!important;padding:0!important;border:1px solid var(--line);border-radius:50%!important;overflow:hidden;cursor:pointer;background:transparent}
.chipcolor::-webkit-color-swatch-wrapper{padding:0}
.chipcolor::-webkit-color-swatch{border:0;border-radius:50%}
.chipcolor::-moz-color-swatch{border:0;border-radius:50%}
.schip.sel{padding-left:4px}
.chipdel{border:0;background:var(--sale);color:#fff;border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:700;cursor:pointer}
.schip.dragging{z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.2);opacity:.95;cursor:grabbing}
.schip.drop-before{box-shadow:-3px 0 0 0 var(--focus)}
.schip.drop-after{box-shadow:3px 0 0 0 var(--focus)}
.etop .nums,.corner span,.dsum span,.legend span,.pinfo,.wlist span,.callegend span,.kpi .k{white-space:nowrap}
.eline{display:flex;align-items:center;gap:6px 8px;flex-wrap:nowrap;min-width:0}
.eline .no{font-family:var(--num);font-weight:700;color:var(--muted);font-size:.85rem}
.eline .nums{margin-left:auto;font-family:var(--num);font-weight:600;font-size:.95rem;white-space:nowrap}
.eline.sub{margin-top:6px;flex-wrap:wrap}
.eline.sub select{padding:3px 6px;font-size:.85rem;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:6.5em}
.eline.sub .chips{display:inline-flex;flex-wrap:wrap;gap:4px}
#dayPanel details.fix{margin-top:4px}
#dayPanel details.fix summary{font-size:.74rem}
.fixrow{display:flex;align-items:center;gap:12px;margin-top:6px}
#dayPanel .ecard.unset{border-left-width:3px}
.schip.hid{opacity:.5;text-decoration:line-through;border-style:dashed}
.schip.sel.hid{opacity:1;text-decoration:none}
.chiphide{border:1px solid var(--sale);background:var(--surface);color:var(--sale);border-radius:999px;padding:2px 9px;font-size:.78rem;font-weight:700;cursor:pointer}
/* settings periods */
.pcard{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.pgrid{display:grid;grid-template-columns:1.2fr 1fr 1fr .7fr;gap:8px}
@media (max-width:620px){.pgrid{grid-template-columns:1fr 1fr}}
.pgrid > label{min-width:0;font-size:.78rem;color:var(--muted);display:block}
.pgrid input{display:block;width:100%;min-width:0;max-width:100%;margin-top:2px;min-height:36px}
.pgrid input[type=date]{-webkit-appearance:none;appearance:none;text-align:left}
.pcard{overflow:hidden}
.weeks{margin-top:10px;background:var(--soft);border-radius:8px;padding:8px 10px}
.weeks .wh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:.85rem;margin-bottom:4px}
.wrow{display:grid;grid-template-columns:2.4em 1fr 1fr auto;gap:8px;align-items:end;padding:4px 0}
.wrow .wl{font-family:var(--num);font-weight:700;padding-bottom:8px}
.pfoot{display:flex;justify-content:space-between;gap:8px;margin-top:10px;flex-wrap:wrap}
.wlist{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.82rem;color:var(--muted)}
.wlist b{color:var(--ink);font-family:var(--num)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>カスタマイズ実績</h1>
    <div class="corner" id="corner" aria-live="polite"></div>
  </header>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-input" aria-selected="true" data-tab="input">日次入力</button>
    <button role="tab" id="tab-cal" aria-selected="false" data-tab="cal">カレンダー</button>
    <button role="tab" id="tab-period" aria-selected="false" data-tab="period">月度集計</button>
    <button role="tab" id="tab-settings" aria-selected="false" data-tab="settings">設定</button>
  </div>
  <div class="banner" id="banner" hidden></div>

  <!-- 日次入力：素早く計算するだけ -->
  <section id="view-input" role="tabpanel" aria-labelledby="tab-input">
    <div class="bar-controls">
      <label class="inline">日付 <input type="date" id="date"></label>
    </div>
    <div class="layout">
      <main>
        <section class="panel" aria-labelledby="addTitle">
          <h2 id="addTitle">1件追加</h2>
          <div class="types" role="group" aria-label="種類">
            <button type="button" class="sale" data-type="delete" aria-pressed="true">デリート</button>
            <button type="button" class="full" data-type="multi" aria-pressed="false">マルチ</button>
          </div>
          <div class="fields">
            <div class="field">
              <label for="bags">カスタマイズ</label>
              <div class="stepper">
                <button type="button" data-step="bags" data-d="-1" aria-label="カスタマイズ件数を1減らす">−</button>
                <input type="number" id="bags" inputmode="numeric" min="0" value="1">
                <button type="button" data-step="bags" data-d="1" aria-label="カスタマイズ件数を1増やす">＋</button>
              </div>
            </div>
            <div class="field">
              <label for="parts">パーツ数</label>
              <div class="stepper">
                <button type="button" data-step="parts" data-d="-1" aria-label="パーツ数を1減らす">−</button>
                <input type="number" id="parts" inputmode="numeric" min="0" value="0">
                <button type="button" data-step="parts" data-d="1" aria-label="パーツ数を1増やす">＋</button>
              </div>
            </div>
            <div class="field price">
              <label for="price">金額（税込）</label>
              <div class="price-in"><span>¥</span><input type="text" id="price" inputmode="numeric" autocomplete="off" placeholder="39,600"></div>
            </div>
          </div>
          <p class="err" id="err" role="alert"></p>
          <button type="button" class="btn primary" id="add">追加する</button>
          
        </section>

        <section class="panel mono-panel" aria-labelledby="monoTitle">
          <h2 id="monoTitle">モノグラミング（M）</h2>
          <div class="stepper">
            <button type="button" data-mono="-1" data-write aria-label="M件数を1減らす">−</button>
            <input type="number" id="monoDay" inputmode="numeric" min="0" value="0" data-write aria-label="M件数">
            <button type="button" data-mono="1" data-write aria-label="M件数を1増やす">＋</button>
          </div>
        </section>

        <section class="panel daylistpanel" aria-labelledby="listTitle">
          <div class="listhead">
            <h2 id="listTitle">当日の明細</h2>
            <button type="button" class="btn small" id="toCal">担当・品相を設定 →</button>
          </div>
          <div class="tablewrap daylist">
            <table>
              <thead><tr><th class="tl">#</th><th class="tl">種類</th><th>件</th><th>パーツ</th><th>税込</th><th>税抜</th><th></th></tr></thead>
              <tbody id="list"></tbody>
            </table>
          </div>
        </section>
      </main>

      <aside class="tape" aria-live="polite">
        <h2>当日合計</h2>
        <div class="date" id="tapeDate"></div>
        <div class="summary">
          <p id="sentence"></p>
          <button type="button" class="btn" id="copy">この文をコピー</button>
        </div>
        <details class="breakdown">
          <summary>内訳を見る</summary>
        <div class="group">
          <h3>カスタマイズ（全体）</h3>
          <div class="row"><span class="lbl">件数</span><span class="val" id="aCnt"></span>
            <div class="sub"><span>デリート <b id="aCntD"></b></span><span>マルチ <b id="aCntM"></b></span></div></div>
          <div class="row"><span class="lbl">金額（税抜）</span><span class="val" id="aAmt"></span>
            <div class="sub"><span>デリート <b id="aAmtD"></b></span><span>マルチ <b id="aAmtM"></b></span></div></div>
          <div class="row"><span class="lbl">unit</span><span class="val" id="aUnit"></span>
            <div class="sub"><span>カスタマイズ <b id="aUnitB"></b></span><span>パーツ <b id="aUnitP"></b></span></div></div>
        </div>
        <div class="group full">
          <h3>マルチのみ</h3>
          <div class="row"><span class="lbl">件数</span><span class="val" id="fCnt"></span></div>
          <div class="row"><span class="lbl">金額（税抜）</span><span class="val" id="fAmt"></span></div>
          <div class="row"><span class="lbl">unit</span><span class="val" id="fUnit"></span></div>
        </div>
        <div class="group">
          <h3>モノグラミング</h3>
          <div class="row"><span class="lbl">M 件数</span><span class="val" id="mCnt"></span></div>
        </div>
        </details>
      </aside>
    </div>
  </section>

  <!-- カレンダー -->
  <section id="view-cal" role="tabpanel" aria-labelledby="tab-cal" hidden>
    <div class="bar-controls">
      <div class="calnav">
        <button type="button" class="btn small" id="calPrev" aria-label="前の月度">‹</button>
        <select id="calPeriod" aria-label="月度"></select>
        <button type="button" class="btn small" id="calNext" aria-label="次の月度">›</button>
      </div>
      <span class="note" id="calNote"></span>
    </div>
    <section class="panel">
      <div id="calGrid"></div>
      <div class="callegend"><span>数字＝その日のカスタマイズ件数</span><span><span class="flag"></span>担当か（マルチの）品相が未設定の明細あり</span></div>
    </section>
    <section class="panel" id="dayPanel" hidden tabindex="-1"></section>
  </section>

  <!-- 月度集計 -->
  <section id="view-period" role="tabpanel" aria-labelledby="tab-period" hidden>
    <div class="bar-controls">
      <label class="inline">月度 <select id="periodSel"></select></label>
      <div class="exports">
        <button type="button" class="btn small" id="dlReport">印刷用ファイル</button>
        <button type="button" class="btn small" id="dlCsv">集計表 CSV</button>
        <button type="button" class="btn small" id="dlCsvRaw">明細 CSV</button>
      </div>
    </div>
    <div id="periodBody"></div>
  </section>

  <!-- 設定 -->
  <section id="view-settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
    <div id="settingsBody"></div>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
  'use strict';
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const comma = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const yen = n => '¥' + comma(n);
  const int = v => { const n = parseInt(v, 10); return isNaN(n) || n < 0 ? 0 : n; };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  // ---------- dates ----------
  const D = s => new Date(s + 'T00:00:00Z');
  const S = d => d.toISOString().slice(0, 10);
  const addDays = (s, n) => { const d = D(s); d.setUTCDate(d.getUTCDate() + n); return S(d); };
  const diff = (a, b) => Math.round((D(b) - D(a)) / 864e5);
  const md = s => (+s.slice(5, 7)) + '/' + (+s.slice(8, 10));
  const WD = '日月火水木金土';
  const dow = s => D(s).getUTCDay();
  const wd = s => WD[dow(s)];
  function todayStr(){ const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
  const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '');

  // ---------- config ----------
  const DEF_CATS = [
    { key:'tabby', label:'Tabby', color:'#E0A030' },
    { key:'shoes', label:'シューズ', color:'#3C7DD9' },
    { key:'other', label:'その他', color:'#C2477A' }
  ];
  function normalize(c){
    c = c || {};
    const cats = (Array.isArray(c.cats) ? c.cats : DEF_CATS).filter(x => x && x.key)
      .map(x => ({ key: String(x.key), label: String(x.label || ''), color: /^#[0-9a-fA-F]{6}$/.test(x.color || '') ? x.color : '#888888', hidden: x.hidden === true }));
    const staff = (Array.isArray(c.staff) ? c.staff : []).filter(x => x && x.id).map(x => ({ id: String(x.id), name: String(x.name || ''), hidden: x.hidden === true }));
    const periods = (Array.isArray(c.periods) ? c.periods : []).filter(p => p && p.id && isDate(p.start) && isDate(p.end))
      .map(p => {
        const o = { id: String(p.id), name: String(p.name || ''), start: p.start, end: p.end, target: int(p.target) };
        return o;
      }).sort((a, b) => a.start < b.start ? -1 : 1);
    const tax = Number(c.tax) === 8 ? 8 : 10;
    return { cats, staff, periods, tax };
  }
  let cfg = normalize({});
  const rate = () => 1 + cfg.tax / 100;
  const catOf = k => cfg.cats.find(c => c.key === k) || null;
  const staffOf = id => cfg.staff.find(s => s.id === id) || null;
  const visCats = t => cfg.cats.filter(c => !c.hidden || (t && t.cat && t.cat[c.key] > 0));
  const getPeriod = id => cfg.periods.find(p => p.id === id) || null;
  const periodFor = d => cfg.periods.find(p => p.start <= d && d <= p.end) || null;
  function autoWeeks(p){
    const out = []; let s = p.start;
    while (s <= p.end){
      let e = addDays(s, 6 - dow(s)); if (e > p.end) e = p.end;
      out.push({ start: s, end: e }); s = addDays(e, 1);
    }
    return out;
  }
  const weeksOf = p => autoWeeks(p).map((w, i) => ({ start: w.start, end: w.end, label: 'W' + (i + 1) }));

  // ---------- state ----------
  let db = null, downloads = null, canWrite = null, cfgReady = false;
  const state = { tab: 'input', date: todayStr(), type: 'delete', periodId: null, selDay: null };

  // ---------- subscriptions (entries + day docs per date range) ----------
  const subs = new Map();
  function wantRanges(){
    const r = [];
    const tp = periodFor(todayStr()); if (tp) r.push([tp.start, tp.end]);
    const vp = getPeriod(state.periodId); if (vp) r.push([vp.start, vp.end]);
    const cov = d => r.some(([s, e]) => s <= d && d <= e);
    if (!cov(state.date)) r.push([state.date, state.date]);
    if (state.selDay && !cov(state.selDay)) r.push([state.selDay, state.selDay]);
    return r;
  }
  function syncSubs(){
    if (!db) return;
    const want = new Map(wantRanges().map(x => [x[0] + '_' + x[1], x]));
    for (const [k, o] of subs) if (!want.has(k)){ o.unsubs.forEach(f => f()); subs.delete(k); }
    for (const [k, [s, e]] of want){
      if (subs.has(k)) continue;
      const o = { start: s, end: e, entries: [], days: {}, readyE: false, readyD: false, unsubs: [] };
      subs.set(k, o);
      const onErr = err => banner('データを読み込めませんでした（' + err.code + '）。ページを再読み込みしてください。');
      o.unsubs.push(db.collection('entries').where('date', '>=', s).where('date', '<=', e).onSnapshot(sn => {
        o.entries = sn.docs.map(d => Object.assign({ id: d.id }, d.data())); o.readyE = true; render();
      }, onErr));
      o.unsubs.push(db.collection('days').where('date', '>=', s).where('date', '<=', e).onSnapshot(sn => {
        const m = {}; sn.docs.forEach(d => m[d.id] = d.data()); o.days = m; o.readyD = true; render();
      }, onErr));
    }
  }
  function cover(s, e){
    let best = null;
    for (const o of subs.values()) if (o.start <= s && e <= o.end && (!best || (o.readyE && o.readyD))) best = o;
    return best;
  }
  const isReady = (s, e) => { const o = cover(s, e); return !!(o && o.readyE && o.readyD); };
  const entriesIn = (s, e) => { const o = cover(s, e); return o ? o.entries.filter(x => x.date >= s && x.date <= e) : []; };
  function monoIn(s, e){
    const o = cover(s, e); let m = 0;
    if (o) for (const k in o.days) if (k >= s && k <= e) m += int(o.days[k].mono);
    return m;
  }

  // ---------- totals ----------
  function totals(list, mono){
    const t = { n: list.length, bags:0, parts:0, incl:0, mono: mono || 0, mBags:0, mParts:0, mIncl:0, dBags:0, dIncl:0, own:0, cat:{}, noCat:0, unset:0 };
    cfg.cats.forEach(c => t.cat[c.key] = 0);
    list.forEach(e => {
      const b = int(e.bags), p = int(e.parts), pr = Number(e.price) || 0;
      t.bags += b; t.parts += p; t.incl += pr; t.mono += int(e.mono);
      if (e.own) t.own += b;
      if (e.type === 'multi'){
        t.mBags += b; t.mParts += p; t.mIncl += pr;
        if (e.cat in t.cat) t.cat[e.cat] += b; else t.noCat += b;
      } else { t.dBags += b; t.dIncl += pr; }
      if (isUnset(e)) t.unset++;
    });
    t.units = t.bags + t.parts; t.mUnits = t.mBags + t.mParts;
    t.ex = t.incl / rate(); t.mEx = t.mIncl / rate(); t.dEx = t.dIncl / rate();
    return t;
  }
  const isUnset = e => int(e.bags) > 0 && (!staffOf(e.staffId) || (e.type === 'multi' && !catOf(e.cat)));
  const sentence = t => t.bags + '件' + t.units + 'unit ' + yen(t.ex) + '（マルチ' + t.mBags + '件' + t.mUnits + 'unit ' + yen(t.mEx) + '）M' + t.mono + '件';

  // ---------- writes ----------
  function writeErr(e){
    if (e && e.code === 'invalid_argument' && canWrite !== true){ canWrite = false; applyWriteMode(); }
    toast(e && e.code === 'quota_exceeded' ? '保存件数の上限です。古い月度の明細を CSV 保存してから削除してください。' : '保存できませんでした（' + ((e && e.code) || 'error') + '）');
  }
  let cfgChain = Promise.resolve();
  function saveCfg(mut){
    if (!db){ toast('保存できません'); return; }
    const next = JSON.parse(JSON.stringify(cfg));
    mut(next);
    cfg = normalize(next);
    if (state.periodId && !getPeriod(state.periodId)) state.periodId = defaultPeriodId();
    syncSubs(); render();
    const body = JSON.parse(JSON.stringify(cfg));
    cfgChain = cfgChain.then(() => db.doc('config/main').set(body)).catch(writeErr);
  }
  const updEntry = (id, patch) => db.doc('entries/' + id).update(patch).catch(writeErr);
  function applyWriteMode(){
    const ro = canWrite === false;
    document.querySelectorAll('[data-write]').forEach(el => el.disabled = ro);
    $('add').disabled = ro;
    if (ro) banner('閲覧のみの権限です。入力・編集するには、オーナーに Editor として招待してもらってください。', true);
  }
  const W = () => canWrite === false ? ' disabled' : '';
  function banner(msg, info){
    const b = $('banner');
    if (!msg){ b.hidden = true; return; }
    b.hidden = false; b.textContent = msg; b.classList.toggle('info', !!info);
  }
  function defaultPeriodId(){
    const p = periodFor(todayStr()) || periodFor(state.date) || cfg.periods[cfg.periods.length - 1];
    return p ? p.id : null;
  }

  // ---------- tabs ----------
  document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
  function setTab(t){
    state.tab = t;
    document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
    ['input', 'cal', 'period', 'settings'].forEach(v => $('view-' + v).hidden = v !== t);
    settingsDirty = true; render();
  }

  // ---------- 日次入力 ----------
  const dateEl = $('date'); dateEl.value = state.date;
  dateEl.addEventListener('change', () => { if (!isDate(dateEl.value)) return; state.date = dateEl.value; syncSubs(); render(); });
  document.querySelectorAll('.types button').forEach(b => b.addEventListener('click', () => {
    state.type = b.dataset.type;
    document.querySelectorAll('.types button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  }));
  document.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => {
    const el = $(b.dataset.step); el.value = Math.max(0, int(el.value) + Number(b.dataset.d));
  }));
  const fmtPrice = el => {
    const digits = el.value.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[^0-9]/g, '').replace(/^0+(?=\d)/, '');
    el.value = digits ? comma(Number(digits)) : '';
  };
  $('price').addEventListener('input', e => fmtPrice(e.target));
  ['bags', 'parts', 'price'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); add(); } }));
  $('add').addEventListener('click', add);
  async function add(){
    const err = $('err');
    if (!db){ err.textContent = '保存先に接続できません。ページを再読み込みしてください。'; return; }
    const bags = int($('bags').value), parts = int($('parts').value);
    const raw = $('price').value.replace(/[^0-9]/g, '');
    if (bags + parts === 0){ err.textContent = 'カスタマイズ件数かパーツ数のどちらかを 1 以上にしてください。'; return; }
    if (raw === ''){ err.textContent = 'この1件の税込金額を入力してください。'; $('price').focus(); return; }
    err.textContent = '';
    const btn = $('add'); btn.disabled = true;
    try {
      await db.collection('entries').add({ date: state.date, type: state.type, bags, parts, price: Number(raw), staffId: '', cat: '', own: false, createdAt: Date.now() });
      $('bags').value = 1; $('parts').value = 0; $('price').value = '';
      $('price').focus(); toast('追加しました');
    } catch(e){ writeErr(e); }
    btn.disabled = canWrite === false;
  }
  // M（日ごと）
  let monoTimer;
  function setMono(v){
    if (!db) return;
    v = Math.max(0, v); $('monoDay').value = v;
    clearTimeout(monoTimer);
    const d = state.date;
    monoTimer = setTimeout(() => { monoTimer = null; db.doc('days/' + d).set({ date: d, mono: v }).catch(writeErr); }, 250);
  }
  document.querySelectorAll('[data-mono]').forEach(b => b.addEventListener('click', () => setMono(int($('monoDay').value) + Number(b.dataset.mono))));
  $('monoDay').addEventListener('change', () => setMono(int($('monoDay').value)));
  $('list').addEventListener('click', e => { const b = e.target.closest('[data-del]'); if (b) delEntry(b.dataset.del); });
  $('toCal').addEventListener('click', () => { openDay(state.date); setTab('cal'); });
  async function delEntry(id){
    if (!db) return;
    const o = [...subs.values()].map(s => s.entries.find(x => x.id === id)).find(Boolean);
    if (!o) return;
    const { id: _, ...body } = o;
    try {
      await db.doc('entries/' + id).delete();
      toast('削除しました', '元に戻す', () => db.doc('entries/' + id).set(body).then(() => toast('元に戻しました'), writeErr));
    } catch(err){ writeErr(err); }
  }
  $('copy').addEventListener('click', () => {
    const text = $('sentence').textContent, done = () => toast('コピーしました');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
    else fallbackCopy(text, done);
  });
  function fallbackCopy(text, done){
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
    ta.select(); try { document.execCommand('copy'); done(); } catch(e){ toast('コピーできませんでした'); }
    ta.remove();
  }

  // ---------- render ----------
  function render(){
    renderCorner();
    if (state.tab === 'input') renderInput();
    else if (state.tab === 'cal') renderCal();
    else if (state.tab === 'period') renderPeriod();
    else renderSettings();
  }
  function renderCorner(){
    const el = $('corner'), today = todayStr(), p = periodFor(today);
    if (!cfgReady){ el.innerHTML = '<div class="c1">読み込み中…</div>'; return; }
    if (!p){ el.innerHTML = '<div class="c1">今日を含む月度がありません</div><div class="c2">「設定」で月度を追加してください</div>'; return; }
    const ready = isReady(p.start, p.end);
    const done = totals(entriesIn(p.start, today)).bags;
    const pct = p.target ? done / p.target * 100 : 0;
    el.innerHTML = '<div class="c1"><span><b>' + esc(p.name) + '</b>（' + md(p.start) + '〜' + md(p.end) + '）</span><span>目標 <b>' + p.target + '</b> 件</span></div>' +
      '<div class="c2"><span>今日まで <b>' + (ready ? done : '…') + '</b> 件</span><span class="pct">' + (ready && p.target ? pct.toFixed(1) + '%' : '—') + '</span></div>' +
      '<div class="progress" aria-hidden="true"><div class="fill' + (pct >= 100 ? ' done' : '') + '" style="width:' + Math.min(100, pct) + '%"></div></div>';
  }

  function renderInput(){
    const day = entriesIn(state.date, state.date);
    const t = totals(day, monoIn(state.date, state.date));
    if (document.activeElement !== $('monoDay') && !monoTimer) $('monoDay').value = monoIn(state.date, state.date);
    $('tapeDate').textContent = state.date + '（' + wd(state.date) + '）・明細 ' + day.length + ' 件・税率 ' + cfg.tax + '%';
    $('sentence').textContent = sentence(t);
    const cnt = n => n + '<small>件</small>';
    $('aCnt').innerHTML = cnt(t.bags); $('aCntD').textContent = t.dBags; $('aCntM').textContent = t.mBags;
    $('aAmt').textContent = yen(t.ex); $('aAmtD').textContent = yen(t.dEx); $('aAmtM').textContent = yen(t.mEx);
    $('aUnit').innerHTML = cnt(t.units); $('aUnitB').textContent = t.bags; $('aUnitP').textContent = t.parts;
    $('fCnt').innerHTML = cnt(t.mBags); $('fAmt').textContent = yen(t.mEx); $('fUnit').innerHTML = cnt(t.mUnits);
    $('mCnt').innerHTML = cnt(t.mono);
    const tb = $('list');
    if (db && !isReady(state.date, state.date)){ tb.innerHTML = '<tr><td colspan="7" class="empty">読み込み中…</td></tr>'; return; }
    if (!day.length){ tb.innerHTML = '<tr><td colspan="7" class="empty">この日のデータはまだありません。</td></tr>'; return; }
    tb.innerHTML = sortDay(day).map((e, i) =>
      '<tr><td class="tl who">' + (i + 1) + '</td><td class="tl kind"><span class="tag ' + (e.type === 'multi' ? 'multi">マルチ' : 'delete">デリート') + '</span></td>' +
      '<td class="num" data-label="件">' + int(e.bags) + '</td><td class="num" data-label="パーツ">' + int(e.parts) + '</td>' +
      '<td class="num" data-label="税込">' + yen(e.price || 0) + '</td><td class="num" data-label="税抜">' + yen((e.price || 0) / rate()) + '</td>' +
      '<td class="del"><button type="button" class="ibtn danger" data-write data-del="' + esc(e.id) + '" aria-label="' + (i + 1) + ' 件目を削除"' + W() + '>×</button></td></tr>').join('');
  }
  const sortDay = list => list.slice().sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

  // ---------- カレンダー ----------
  function fillPeriodSelect(sel){
    sel.innerHTML = cfg.periods.length ? cfg.periods.map(p => '<option value="' + esc(p.id) + '"' + (p.id === state.periodId ? ' selected' : '') + '>' + esc(p.name) + '（' + md(p.start) + '〜' + md(p.end) + '）</option>').join('')
      : '<option value="">（設定で月度を追加）</option>';
  }
  function choosePeriod(id){
    state.periodId = id || null;
    const p = getPeriod(state.periodId);
    if (p && state.selDay && (state.selDay < p.start || state.selDay > p.end)) state.selDay = null;
    syncSubs(); render();
  }
  $('calPeriod').addEventListener('change', e => choosePeriod(e.target.value));
  $('periodSel').addEventListener('change', e => choosePeriod(e.target.value));
  function stepPeriod(d){
    const i = cfg.periods.findIndex(p => p.id === state.periodId);
    const n = cfg.periods[i + d]; if (n) choosePeriod(n.id);
  }
  $('calPrev').addEventListener('click', () => stepPeriod(-1));
  $('calNext').addEventListener('click', () => stepPeriod(1));
  function openDay(d){
    state.selDay = d;
    const p = periodFor(d); if (p) state.periodId = p.id;
    syncSubs();
  }
  $('calGrid').addEventListener('click', e => {
    const b = e.target.closest('[data-day]'); if (!b) return;
    const d = b.dataset.day;
    if (state.selDay === d){ state.selDay = null; syncSubs(); render(); return; }
    openDay(d); render();
    const panel = $('dayPanel'); panel.scrollIntoView({ behavior: 'smooth', block: 'start' }); panel.focus({ preventScroll: true });
  });

  function renderCal(){
    fillPeriodSelect($('calPeriod'));
    const i = cfg.periods.findIndex(p => p.id === state.periodId);
    $('calPrev').disabled = i <= 0; $('calNext').disabled = i < 0 || i >= cfg.periods.length - 1;
    const p = getPeriod(state.periodId), grid = $('calGrid');
    if (!p){ grid.innerHTML = '<p class="empty">月度がありません。「設定」で追加してください。</p>'; $('calNote').textContent = ''; renderDay(); return; }
    const days = diff(p.start, p.end) + 1;
    $('calNote').textContent = '目標 ' + p.target + ' 件・日割り ' + (p.target / days).toFixed(1) + ' 件/日';
    if (db && !isReady(p.start, p.end)){ grid.innerHTML = '<p class="empty">読み込み中…</p>'; renderDay(); return; }
    const list = entriesIn(p.start, p.end), byDay = {}, unsetDay = {};
    list.forEach(e => { byDay[e.date] = (byDay[e.date] || 0) + int(e.bags); if (isUnset(e)) unsetDay[e.date] = true; });
    const today = todayStr();
    let h = [...WD].map((d, k) => '<span class="h' + (k === 0 ? ' sun' : '') + '">' + d + '</span>').join('');
    for (let k = 0; k < dow(p.start); k++) h += '<span class="blank"></span>';
    for (let s = p.start; s <= p.end; s = addDays(s, 1)){
      const c = byDay[s] || 0;
      h += '<button type="button" class="day' + (c ? '' : ' zero') + (s === today ? ' today' : '') + '" data-day="' + s + '" aria-pressed="' + (state.selDay === s) + '" aria-label="' + md(s) + '（' + wd(s) + '）' + c + '件' + (unsetDay[s] ? '・未設定あり' : '') + '">' +
        (unsetDay[s] ? '<span class="flag"></span>' : '') + '<span class="d">' + (s === p.start || s.slice(8) === '01' ? md(s) : String(+s.slice(8))) + '</span><span class="c">' + c + '<small>件</small></span></button>';
    }
    grid.innerHTML = '<div class="calgrid">' + h + '</div>';
    renderDay();
  }

  function staffOptions(sel){
    return '<option value="">未設定</option>' + cfg.staff.filter(s => !s.hidden || s.id === sel).map(s => '<option value="' + esc(s.id) + '"' + (s.id === sel ? ' selected' : '') + '>' + esc(s.name || '（名前なし）') + '</option>').join('');
  }
  function renderDay(){
    const panel = $('dayPanel'), d = state.selDay;
    if (!d){ panel.hidden = true; return; }
    panel.hidden = false;
    if (panel.contains(document.activeElement) && /INPUT|SELECT/.test(document.activeElement.tagName) && document.activeElement.type !== 'checkbox'){ dayDirty = true; return; }
    dayDirty = false;
    if (db && !isReady(d, d)){ panel.innerHTML = '<p class="empty">読み込み中…</p>'; return; }
    const list = sortDay(entriesIn(d, d)), t = totals(list, monoIn(d, d));
    const unset = list.filter(isUnset);
    let h = '<div class="listhead"><h2>' + md(d) + '（' + wd(d) + '）の明細</h2><button type="button" class="btn small" data-close>閉じる</button></div>' +
      '<div class="dsum"><span>合計 <b>' + t.bags + '</b> 件</span><span>マルチ <b>' + t.mBags + '</b></span><span>デリート <b>' + t.dBags + '</b></span><span>M <b>' + t.mono + '</b></span><span>税抜 <b>' + yen(t.ex) + '</b></span></div>';
    if (!list.length){ panel.innerHTML = h + '<p class="empty">この日の明細はありません。「日次入力」で追加できます。</p>'; return; }
    if (!cfg.staff.length) h += '<p class="note">担当者を選ぶには、先に「設定」でスタッフを登録してください。</p>';
    const shown = list.map((e, i) => ({ e, i })).sort((a, b) => (isUnset(b.e) - isUnset(a.e)) || (a.i - b.i));
    h += shown.map(({ e, i }) => {
      const multi = e.type === 'multi', id = esc(e.id);
      return '<div class="ecard' + (isUnset(e) ? ' unset' : '') + '">' +
        '<div class="eline"><span class="no">#' + (i + 1) + '</span>' +

  async function splitEntry(id){
    const e = entriesIn(state.selDay, state.selDay).find(x => x.id === id); if (!e || !db) return;
    const n = int(e.bags); if (n < 2) return;
    const total = Number(e.price) || 0, each = Math.floor(total / n / 10) * 10, first = total - each * (n - 1);
    const base = { date: e.date, type: e.type, staffId: e.staffId || '', cat: e.cat || '', own: !!e.own, parts: 0, bags: 1, price: each };
    try {
      await Promise.all([db.doc('entries/' + id).update({ bags: 1, price: first })]
        .concat(Array.from({ length: n - 1 }, (_, k) => db.collection('entries').add(Object.assign({}, base, { createdAt: (e.createdAt || Date.now()) + k + 1 })))));

  // ---------- 月度集計 ----------
  function periodData(p){
    const today = todayStr(), days = diff(p.start, p.end) + 1;
    const elapsed = today < p.start ? 0 : today > p.end ? days : diff(p.start, today) + 1;
    const weeks = weeksOf(p);
    const list = entriesIn(p.start, p.end);
    const t = totals(list, monoIn(p.start, p.end));
    const byDay = {}; list.forEach(e => byDay[e.date] = (byDay[e.date] || 0) + int(e.bags));
    const inW = (l, w) => l.filter(e => e.date >= w.start && e.date <= w.end);
    const rows = cfg.staff.map(s => ({ name: s.name || '（名前なし）', list: list.filter(e => e.staffId === s.id), hidden: s.hidden })).filter(r => !r.hidden || r.list.length);
    const none = list.filter(e => !staffOf(e.staffId) && int(e.bags) > 0);
    if (none.length) rows.unshift({ name: '（担当未設定）', list: none, unset: true });
    rows.forEach(r => { r.t = totals(r.list); r.weeks = weeks.map(w => totals(inW(r.list, w))); });
    const weekTotals = weeks.map(w => totals(inW(list, w)));
    return { today, days, elapsed, daily: p.target / days, weeks, list, t, byDay, rows, weekTotals };
  }
  function chartSVG(p, pd){
    const Wd = 640, H = 240, L = 40, R = 14, T = 14, B = 30, n = pd.days;
    let cum = 0; const pts = [];
    for (let i = 0; i < Math.min(pd.elapsed, n); i++){ cum += pd.byDay[addDays(p.start, i)] || 0; pts.push(cum); }
    const ymax = Math.max(p.target, cum, 10) * 1.08;
    const x = i => L + (Wd - L - R) * (i / n), y = v => T + (H - T - B) * (1 - v / ymax);
    let g = '';
    const step = ymax > 400 ? 100 : ymax > 150 ? 50 : ymax > 60 ? 20 : 10;
    for (let v = 0; v <= ymax; v += step) g += '<line x1="' + L + '" x2="' + (Wd - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--line)"/><text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="11" fill="var(--muted)">' + v + '</text>';
    pd.weeks.forEach(w => { const i = diff(p.start, w.start); g += '<line x1="' + x(i) + '" x2="' + x(i) + '" y1="' + T + '" y2="' + (H - B) + '" stroke="var(--line)" stroke-dasharray="2 3"/><text x="' + (x(i) + 3) + '" y="' + (H - B + 16) + '" font-size="11" fill="var(--muted)">' + w.label + ' ' + md(w.start) + '</text>'; });
    if (p.target > 0) g += '<line x1="' + x(0) + '" y1="' + y(0) + '" x2="' + x(n) + '" y2="' + y(p.target) + '" stroke="var(--target)" stroke-width="2" stroke-dasharray="6 5"/><text x="' + (x(n) - 4) + '" y="' + (y(p.target) - 8) + '" text-anchor="end" font-size="11" fill="var(--muted)" paint-order="stroke" stroke="var(--surface)" stroke-width="3">目標 ' + p.target + '</text>';
    if (pts.length) g += '<path d="M' + x(0) + ',' + y(0) + ' ' + pts.map((v, i) => 'L' + x(i + 1) + ',' + y(v)).join(' ') + '" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>' +
      '<circle cx="' + x(pts.length) + '" cy="' + y(cum) + '" r="4" fill="var(--ink)"/>' + (() => {
        const px = x(pts.length), py = y(cum), ty = y(p.target), nearRight = px > Wd - R - 110;
        const clash = p.target > 0 && nearRight && Math.abs(py - (ty - 8)) < 22;
        const below = clash ? true : py < T + 18;
        const lx = nearRight ? px - 8 : px + 8, anchor = nearRight ? 'end' : 'start';
        return '<text x="' + lx + '" y="' + (below ? py + 18 : py - 8) + '" text-anchor="' + anchor + '" font-size="12" font-weight="700" fill="var(--ink)" paint-order="stroke" stroke="var(--surface)" stroke-width="3">実績 ' + cum + '</text>';
      })();
    return '<svg viewBox="0 0 ' + Wd + ' ' + H + '" role="img" aria-label="累計件数と目標ラインの推移" font-family="Barlow Semi Condensed, Noto Sans JP, sans-serif">' + g + '</svg>';
  }
