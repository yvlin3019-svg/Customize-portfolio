      'h1{font-size:18px;margin:0 0 4px}.meta{color:#5E6B78;margin-bottom:14px}' +
      'table{border-collapse:collapse;width:100%}th,td{border:1px solid #CDD5DC;padding:6px 8px;text-align:center;white-space:nowrap}' +
      'th{background:#F2F5F7;font-weight:500;font-size:12px}th.grp{font-weight:700}.tl{text-align:left}.r{text-align:right}' +
      'td b{font-size:14px}td .p{display:block;font-size:11px;color:#5E6B78}tr.total td{font-weight:700;border-top:2px solid #1C2733}' +
      '.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle;-webkit-print-color-adjust:exact;print-color-adjust:exact}' +
      '.note{color:#5E6B78;font-size:11px;margin-top:8px}.wrapt{overflow-x:auto}' +
      '.pbtn{position:fixed;top:12px;right:12px;padding:8px 16px;font-size:14px}@media print{.pbtn{display:none}body{margin:10mm}@page{size:A4 landscape}}' +
      '</style></head><body><button class="pbtn" onclick="window.print()">印刷</button>' +
      '<h1>カスタマイズ実績　' + esc(p.name) + '</h1>' +
      '<div class="meta">' + p.start + ' 〜 ' + p.end + '　目標 ' + p.target + ' 件　達成 ' + t.bags + ' 件（' + pctTxt(t.bags, p.target) + '）　出力 ' + pd.today + '</div>' +
      '<div class="wrapt"><table><thead><tr><th class="tl" rowspan="2">名前</th><th rowspan="2">金額（税抜）</th><th rowspan="2">件数</th><th class="grp" colspan="2">内訳</th>' +
        (cols.length ? '<th class="grp" colspan="' + cols.length + '">マルチの品相</th>' : '') + '</tr><tr><th>デリート</th><th>マルチ</th>' +
        cols.map(c => '<th>' + (c.color ? '<span class="dot" style="background:' + c.color + '"></span>' : '') + esc(c.label) + '</th>').join('') + '</tr></thead><tbody>' +
        pd.rows.map(r => row(r.name, r.t)).join('') + row('合計', t, 'total') +
      '</tbody></table></div>' +
      '<p class="note">デリート・マルチの比率は件数に対する割合、品相の比率はマルチ件数に対する割合です。</p></body></html>';
    save('customize_' + p.name + '_月度表.html', html);
  });

  // ---------- 設定 ----------
  let settingsDirty = true;
  const sb = $('settingsBody');
  sb.addEventListener('focusout', () => setTimeout(() => { if (settingsDirty && state.tab === 'settings' && !sb.contains(document.activeElement)) renderSettings(); }, 0));
  function renderSettings(){
    const a = document.activeElement;
    if (drag || chipDrag || (sb.contains(a) && a.tagName === 'INPUT' && a.type !== 'checkbox' && a.type !== 'color')){ settingsDirty = true; return; }
    settingsDirty = false;
    const w = W();
    const x = (attr, label, dis) => '<button type="button" class="ibtn danger" data-write ' + attr + ' aria-label="' + label + '"' + (dis || w) + '>×</button>';
    const chipHTML = (kind, key, i, label, pre, delAttr, selExtra, hidden) => (sel && sel.kind === kind && sel.key === key)
      ? '<span class="schip sel' + (hidden ? ' hid' : '') + '" data-kind="' + kind + '" data-key="' + esc(key) + '" data-idx="' + i + '">' + (selExtra || pre) + '<span class="nm">' + label + '</span>' +
        '<button type="button" class="chiphide" data-write data-hidekind="' + kind + '" data-hidekey="' + esc(key) + '"' + w + '>' + (hidden ? '再表示' : '非表示') + '</button>' +
        '<button type="button" class="chipdel" data-write ' + delAttr + w + '>削除</button></span>'
      : '<button type="button" class="schip' + (hidden ? ' hid' : '') + '" data-write data-kind="' + kind + '" data-key="' + esc(key) + '" data-idx="' + i + '" aria-label="' + label + (hidden ? '（非表示中）' : '') + '（タップでメニュー、左右キーで並べ替え）"' + w + '>' + pre + label + '</button>';
    const handle = (i, name) => '<button type="button" class="handle" data-write data-idx="' + i + '" aria-label="' + esc(name) + ' を並べ替え（上下キーでも移動できます）"' + w + '>≡</button>';
    sb.innerHTML =
      '<section class="panel"><h2>スタッフ<small>タップで非表示・削除／ドラッグで並べ替え</small></h2><div class="chipbox" data-chips="staff">' +
        (cfg.staff.length ? cfg.staff.map((s, i) => chipHTML('staff', s.id, i, esc(s.name || '（名前なし）'), '', 'data-rmstaff="' + esc(s.id) + '"', '', s.hidden)).join('') : '<p class="note">まだ登録されていません。</p>') +
        '</div><div class="addrow"><input type="text" class="plain" id="newStaff" placeholder="名前" data-write' + w + '><button type="button" class="btn small" id="addStaff" data-write' + w + '>追加</button></div>' +
      '</section>' +
      '<section class="panel"><h2>月度と目標<small>週は日〜土で自動</small></h2>' +
        cfg.periods.slice().reverse().map(p => {
          const wk = weeksOf(p), pid = esc(p.id), days = diff(p.start, p.end) + 1;
          return '<div class="pcard">' +
            '<div class="pline"><input type="text" class="plain pname" data-write data-pf="name" data-pid="' + pid + '" value="' + esc(p.name) + '" aria-label="月度名"' + w + '>' +
              '<label class="ptgt">目標<input type="number" class="plain" inputmode="numeric" min="0" data-write data-pf="target" data-pid="' + pid + '" value="' + p.target + '" aria-label="目標件数"' + w + '>件</label>' +
              x('data-rmperiod="' + pid + '"', esc(p.name) + 'を削除') + '</div>' +
            '<div class="pline dates"><input type="date" data-write data-pf="start" data-pid="' + pid + '" value="' + p.start + '" aria-label="開始日"' + w + '><span>〜</span>' +
              '<input type="date" data-write data-pf="end" data-pid="' + pid + '" value="' + p.end + '" aria-label="終了日"' + w + '>' +
              '<span class="pinfo">' + days + '日・' + (p.target / days).toFixed(1) + '件/日</span></div>' +
            '<div class="wlist">' + wk.map(q => '<span><b>' + q.label + '</b> ' + md(q.start) + '–' + md(q.end) + '</span>').join('') + '</div></div>';
        }).join('') +
        '<div class="addrow"><button type="button" class="btn small" id="addPeriod" data-write' + w + '>＋ 次の月度</button><span class="note">前の月度の翌日から4週間で作成</span></div>' +
      '</section>' +
      '<section class="panel"><h2>品相とシールの色<small>タップで色変更・非表示・削除</small></h2><div class="chipbox" data-chips="cats">' +
        (cfg.cats.length ? cfg.cats.map((c, i) => chipHTML('cats', c.key, i, esc(c.label),
          '<span class="dot" style="background:' + c.color + '"></span>',
          'data-rmcat="' + esc(c.key) + '"',
          '<input type="color" class="chipcolor" data-write data-catcolor="' + esc(c.key) + '" value="' + c.color + '" aria-label="' + esc(c.label) + ' の色"' + w + '>', c.hidden)).join('') : '<p class="note">まだ登録されていません。</p>') +
        '</div><div class="addrow"><input type="color" id="newCatColor" value="#2E9E6B" aria-label="新しい品相の色" data-write' + w + '><input type="text" class="plain" id="newCat" placeholder="品相名" data-write' + w + '><button type="button" class="btn small" id="addCat" data-write' + w + '>追加</button></div>' +
      '</section>' +
      '<section class="panel taxrow"><h2>税率</h2><select id="taxSel" aria-label="税率" data-write' + w + '><option value="10"' + (cfg.tax === 10 ? ' selected' : '') + '>10%</option><option value="8"' + (cfg.tax === 8 ? ' selected' : '') + '>8%</option></select></section>';
  }
  const pOf = (c, id) => c.periods.find(p => p.id === id);
  sb.addEventListener('change', e => {
    const el = e.target, v = el.value;
    if (el.dataset.staffname){ const id = el.dataset.staffname; saveCfg(c => { const s = c.staff.find(x => x.id === id); if (s) s.name = v.trim(); }); }
    else if (el.dataset.pf){
      const id = el.dataset.pid, f = el.dataset.pf;
      if ((f === 'start' || f === 'end') && !isDate(v)) return;
      saveCfg(c => { const p = pOf(c, id); if (!p) return; p[f] = f === 'target' ? int(v) : v; if (p.end < p.start) p.end = p.start; });
    }
    else if (el.dataset.catcolor){ const k = el.dataset.catcolor; saveCfg(c => { const x = c.cats.find(q => q.key === k); if (x) x.color = v; }); }
    else if (el.dataset.catlabel){ const k = el.dataset.catlabel; if (!v.trim()) return; saveCfg(c => { const x = c.cats.find(q => q.key === k); if (x) x.label = v.trim(); }); }
    else if (el.id === 'taxSel') saveCfg(c => { c.tax = Number(v); });
  });
  const armed = {};
  function confirmTwice(btn, key){
    if (armed[key]){ delete armed[key]; return true; }
    armed[key] = true; const orig = btn.textContent; btn.textContent = btn.classList.contains('ibtn') ? 'もう一度' : 'もう一度押して削除'; btn.classList.add('armed');
    setTimeout(() => { if (armed[key]){ delete armed[key]; if (btn.isConnected){ btn.textContent = orig; btn.classList.remove('armed'); } } }, 4000);
    return false;
  }
  let sel = null, suppressClick = false;
  sb.addEventListener('click', e => {
    if (suppressClick){ suppressClick = false; e.preventDefault(); return; }
    if (e.target.closest('.chipcolor')) return;
    const chip = e.target.closest('.schip');
    if (chip && !e.target.closest('.chipdel') && !e.target.closest('.chiphide')){
      const k = chip.dataset.kind, key = chip.dataset.key;
      sel = sel && sel.kind === k && sel.key === key ? null : { kind: k, key };
      settingsDirty = true; renderSettings();
      const n = sb.querySelector(sel ? '.schip.sel .chipdel' : '.schip[data-kind="' + k + '"][data-key="' + key + '"]'); if (n) n.focus();
      return;
    }
    if (sel && !e.target.closest('.chipdel') && !e.target.closest('.chiphide')){ sel = null; settingsDirty = true; setTimeout(renderSettings, 0); }
    const b = e.target.closest('button'); if (!b) return;
    const d = b.dataset;
    if (b.id === 'addStaff'){
      const v = $('newStaff').value.trim(); if (!v){ $('newStaff').focus(); return; }
      $('newStaff').value = '';
      saveCfg(c => { c.staff.push({ id: 's' + uid(), name: v }); }); toast(v + ' を追加しました');
    } else if (d.move){
      const [i, k] = d.move.split(':').map(Number);
      saveCfg(c => { const j = i + k; if (j < 0 || j >= c.staff.length) return; [c.staff[i], c.staff[j]] = [c.staff[j], c.staff[i]]; });
    } else if (d.hidekind){
      const kind = d.hidekind, key = d.hidekey; sel = null;
      saveCfg(c => { const it = kind === 'staff' ? c.staff.find(x => x.id === key) : c.cats.find(x => x.key === key); if (it) it.hidden = !it.hidden; });
      const it = kind === 'staff' ? staffOf(key) : catOf(key);
      toast((it ? (it.name || it.label) : '') + (it && it.hidden ? ' を非表示にしました（過去の記録は残ります）' : ' を再表示しました'));
    } else if (d.rmstaff){
      sel = null;
      const prev = cfg.staff.slice(), name = (staffOf(d.rmstaff) || {}).name || '';
      saveCfg(c => { c.staff = c.staff.filter(x => x.id !== d.rmstaff); });
      toast(name + ' を削除しました', '元に戻す', () => saveCfg(c => { c.staff = prev; }));
    } else if (b.id === 'addPeriod'){
      saveCfg(c => {
        const last = c.periods[c.periods.length - 1];
        const start = last ? addDays(last.end, 1) : (() => { const t = todayStr(); return addDays(t, -dow(t)); })();
        let name = 'P1';
        if (last){ const m = last.name.match(/^(.*?)(\d+)(\D*)$/); name = m ? m[1] + (Number(m[2]) + 1) + m[3] : last.name + '+1'; }
        c.periods.push({ id: 'p' + uid(), name, start, end: addDays(start, 27), target: last ? last.target : 0 });
      });
    } else if (d.rmperiod){
      if (!confirmTwice(b, 'rp' + d.rmperiod)) return;
      const prev = cfg.periods.slice();
      saveCfg(c => { c.periods = c.periods.filter(p => p.id !== d.rmperiod); });
      toast('月度を削除しました', '元に戻す', () => saveCfg(c => { c.periods = prev; }));
    } else if (b.id === 'addCat'){
      const v = $('newCat').value.trim(); if (!v){ $('newCat').focus(); return; }
      const col = $('newCatColor').value; $('newCat').value = '';
      saveCfg(c => { c.cats.push({ key: 'c' + uid(), label: v, color: col }); }); toast(v + ' を追加しました');
    } else if (d.cmove){
      const [i, k] = d.cmove.split(':').map(Number);
      saveCfg(c => { const j = i + k; if (j < 0) return; [c.cats[i], c.cats[j]] = [c.cats[j], c.cats[i]]; });
    } else if (d.rmcat){
      sel = null;
      const prev = cfg.cats.slice(), name = (catOf(d.rmcat) || {}).label || '';
      saveCfg(c => { c.cats = c.cats.filter(x => x.key !== d.rmcat); });
      toast(name + ' を削除しました', '元に戻す', () => saveCfg(c => { c.cats = prev; }));
    }
  });

  // ---------- ドラッグで並べ替え（スタッフ・品相） ----------
  let drag = null;
  function moveItem(kind, from, to){
    if (from === to) return;
    saveCfg(c => { const arr = c[kind]; if (!arr || !arr[from]) return; const [it] = arr.splice(from, 1); arr.splice(to, 0, it); });
  }
  sb.addEventListener('pointerdown', e => {
    const h = e.target.closest('.handle'); if (!h || h.disabled) return;
    const list = h.closest('[data-reorder]'); if (!list) return;
    const rows = [...list.children].filter(r => r.classList.contains('srow') || r.classList.contains('catset'));
    const row = h.closest('.srow, .catset'), from = rows.indexOf(row);
    if (from < 0 || rows.length < 2) return;
    e.preventDefault();
    try { h.setPointerCapture(e.pointerId); } catch(err){}
    const rects = rows.map(r => r.getBoundingClientRect());
    const step = rects[1].top - rects[0].top || rects[0].height;
    drag = { kind: list.dataset.reorder, rows, rects, row, from, to: from, startY: e.clientY, step };
    row.classList.add('dragging');
    rows.forEach(r => { if (r !== row) r.classList.add('shifting'); });
  });
  sb.addEventListener('pointermove', e => {
    if (!drag) return;
    e.preventDefault();
    const dy = e.clientY - drag.startY;
    drag.row.style.transform = 'translateY(' + dy + 'px)';
    const r0 = drag.rects[drag.from], center = r0.top + r0.height / 2 + dy;
    let to = 0;
    drag.rects.forEach((rc, i) => { if (i !== drag.from && center > rc.top + rc.height / 2) to++; });
    drag.to = to;
    drag.rows.forEach((r, i) => {
      if (i === drag.from) return;
      let shift = 0;
      if (drag.from < to && i > drag.from && i <= to) shift = -drag.step;
      if (drag.from > to && i < drag.from && i >= to) shift = drag.step;
      r.style.transform = shift ? 'translateY(' + shift + 'px)' : '';
    });
  });
  function endDrag(){
    if (!drag) return;
    const d = drag; drag = null;
    d.rows.forEach(r => { r.style.transform = ''; r.classList.remove('dragging', 'shifting'); });
    if (d.to !== d.from) moveItem(d.kind, d.from, d.to);
    else if (settingsDirty) renderSettings();
  }
  sb.addEventListener('pointerup', endDrag);
  sb.addEventListener('pointercancel', endDrag);
  sb.addEventListener('keydown', e => {
    const h = e.target.closest('.handle'); if (!h || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
    e.preventDefault();
    const kind = h.closest('[data-reorder]').dataset.reorder, i = Number(h.dataset.idx), j = i + (e.key === 'ArrowUp' ? -1 : 1);
    if (j < 0 || j >= cfg[kind].length) return;
    moveItem(kind, i, j);
    setTimeout(() => { const n = sb.querySelector('[data-reorder="' + kind + '"] .handle[data-idx="' + j + '"]'); if (n) n.focus(); }, 0);
  });

  // スタッフのチップ：ドラッグで並べ替え（折り返しあり）
  let chipDrag = null;
  sb.addEventListener('pointerdown', e => {
    const chip = e.target.closest('.schip'); if (!chip || e.target.closest('.chipdel') || e.target.closest('.chiphide') || e.target.closest('.chipcolor') || canWrite === false) return;
    const box = chip.closest('[data-chips]'); if (!box) return;
    chipDrag = { chip, box, from: Number(chip.dataset.idx), x0: e.clientX, y0: e.clientY, started: false, id: e.pointerId, target: null, before: true };
  });
  sb.addEventListener('pointermove', e => {
    const c = chipDrag; if (!c || e.pointerId !== c.id) return;
    const dx = e.clientX - c.x0, dy = e.clientY - c.y0;
    if (!c.started){
      if (Math.hypot(dx, dy) < 6) return;
      c.started = true;
      try { c.chip.setPointerCapture(e.pointerId); } catch(err){}
      c.others = [...c.box.querySelectorAll('.schip')].filter(x => x !== c.chip).map(el => ({ el, idx: Number(el.dataset.idx), r: el.getBoundingClientRect() }));
      c.chip.classList.add('dragging');
    }
    e.preventDefault();
    c.chip.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    let best = null, bd = Infinity;
    c.others.forEach(o => { const cx = o.r.left + o.r.width / 2, cy = o.r.top + o.r.height / 2, d = Math.hypot(e.clientX - cx, (e.clientY - cy) * 1.6); if (d < bd){ bd = d; best = o; } });
    c.others.forEach(o => o.el.classList.remove('drop-before', 'drop-after'));
    if (best){ c.target = best; c.before = e.clientX < best.r.left + best.r.width / 2; best.el.classList.add(c.before ? 'drop-before' : 'drop-after'); }
  });
  function endChip(){
    const c = chipDrag; chipDrag = null; if (!c || !c.started) return;
    suppressClick = true; setTimeout(() => { suppressClick = false; }, 50);
    c.chip.style.transform = ''; c.chip.classList.remove('dragging');
    c.others.forEach(o => o.el.classList.remove('drop-before', 'drop-after'));
    if (c.target){
      const order = c.others.map(o => o.idx);
      const k = order.indexOf(c.target.idx);
      const to = c.before ? k : k + 1;
      if (to !== c.from) moveItem(c.box.dataset.chips, c.from, to); else if (settingsDirty) renderSettings();
    }
  }
  sb.addEventListener('pointerup', endChip);
  sb.addEventListener('pointercancel', () => { const c = chipDrag; chipDrag = null; if (c && c.started){ c.chip.style.transform = ''; c.chip.classList.remove('dragging'); c.others.forEach(o => o.el.classList.remove('drop-before', 'drop-after')); } });
  sb.addEventListener('keydown', e => {
    const chip = e.target.closest('.schip'); if (!chip || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
    e.preventDefault();
    const kind = chip.dataset.kind, i = Number(chip.dataset.idx), j = i + (e.key === 'ArrowLeft' ? -1 : 1);
    if (j < 0 || j >= cfg[kind].length) return;
    moveItem(kind, i, j);
    setTimeout(() => { const n = sb.querySelector('.schip[data-kind="' + kind + '"][data-idx="' + j + '"]'); if (n) n.focus(); }, 0);
  });

  // ---------- toast ----------
  let tt;
  function toast(msg, actionLabel, onAction){
    const el = $('toast'); el.textContent = msg; el.classList.toggle('action', !!actionLabel);
    if (actionLabel){
      const b = document.createElement('button'); b.type = 'button'; b.textContent = actionLabel;
      b.addEventListener('click', () => { el.classList.remove('show', 'action'); onAction(); });
      el.appendChild(b);
    }
    el.classList.add('show'); clearTimeout(tt);
    tt = setTimeout(() => el.classList.remove('show', 'action'), actionLabel ? 6000 : 1800);
  }

  // ---------- boot ----------
  render();
  banner('共有データに接続中…', true);
  (async () => {
    const use = window.claude && window.claude.use;
    if (!use){ banner('共有データに接続できません。claude.ai のリンクから開いてください。'); return; }
    const [dbNs, dl, user] = await Promise.all([use('db'), use('downloads'), use('user')]);
    downloads = dl;
    if (!downloads) ['dlReport', 'dlCsv', 'dlCsvRaw'].forEach(id => $(id).hidden = true);
    if (!dbNs){ banner('共有データに接続できません。ページを再読み込みしてください。'); return; }
    db = dbNs;
    const cw = user ? await user.can('data.write') : null;
    canWrite = cw === false ? false : cw === true ? true : null;
    db.doc('config/main').onSnapshot(snap => {
      cfg = normalize(snap.exists ? snap.data() : {});
      if (!cfgReady){ cfgReady = true; banner(''); state.periodId = defaultPeriodId(); applyWriteMode(); }
      else if (!getPeriod(state.periodId)) state.periodId = defaultPeriodId();
      settingsDirty = true;
      syncSubs(); render();
    }, err => banner('設定を読み込めませんでした（' + err.code + '）。ページを再読み込みしてください。'));
  })();
})();
</script>
</body>
</html>
